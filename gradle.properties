org.gradle.jvmargs=-Xmx1G

# 运行 Gradle 进程本身的 JVM 固定为 JDK 17。
# 机器默认 JDK 为 25，而 Gradle 8.8 无法在 JDK 25 上运行（class major version 69 不受支持），
# 因此这里把跑 Gradle 的 JVM 也钉死在 17。这条同时保证了"能跑 Gradle"与"用 17 编译"。
# 换机器时若路径不同，改这一行即可。
org.gradle.java.home=/opt/homebrew/opt/openjdk@17

# Java toolchain：显式约束编译所用 JDK 为 17（见 build.gradle 的 java.toolchain）。
# 与上面的 org.gradle.java.home 指向同一个 17；即使有人覆盖了 java.home，toolchain 仍会
# 从下面这个已安装路径里挑 17，挑不到就直接报错，避免误用 21/25 编译。
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@17
# 关闭 toolchain 自动下载：找不到匹配的本地 JDK 时直接失败，而不是联网拉取。
org.gradle.java.installations.auto-download=false

# Mod 版本
mod_version=1.0.0

# 默认编译目标（可用 -Pmc=1.20.1 / -Pmc=1.20.4 覆盖）
default_mc=1.20.4
